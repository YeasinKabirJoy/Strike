{% for chat in chats %}
    {% include 'snippet/message.html' %}
{% endfor %}
{% if has_more_messages and chats %}
    <div id="older-messages-cursor"
         data-before-created-at="{{ chats.0.created_at|date:'c' }}"
         data-before-id="{{ chats.0.id }}">
    </div>
{% else %}
    <div id="older-messages-cursor"
         data-before-created-at=""
         data-before-id="">
    </div>
{% endif %}
